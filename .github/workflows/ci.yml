name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Mínimo privilegio por defecto; cada job pide solo lo que necesita.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Escaneo de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # todo el historial: un secret borrado sigue en git
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # token automático y efímero de Actions

  build:
    name: Armar sitio estático
    needs: gitleaks # si gitleaks falla, no se construye ni se publica nada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copiar harness y shaders a _site
        run: |
          mkdir -p _site
          cp -r web hit1 hit2 hit3 hit4 hit5 hit6 _site/
          # La raíz del sitio redirige al harness
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=web/"><a href="web/">Ir al harness</a>\n' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy a GitHub Pages (OIDC)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write # token OIDC efímero: zero static keys
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
